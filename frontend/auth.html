<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SendFlow - Login/Register</title>
    <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../public/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
    <link rel="manifest" href="../public/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../public/logo.png" alt="SendFlow Logo" class="navbar-logo">
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2>Login</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <a href="forgot-password.html" class="forgot-password-link">Forgot password?</a>
                <button type="submit" class="btn btn-primary">Login</button>
                <p class="form-toggle">
                    Don't have an account? 
                    <button type="button" onclick="toggleForms()">Create one</button>
                </p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
                <p class="form-toggle">
                    Already have an account? 
                    <button type="button" onclick="toggleForms()">Login</button>
                </p>
            </form>
        </div>

        <p class="auth-footer">
            © 2026 SendFlow. <a href="index.html">Back to home</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
