<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Email - Java Mailer</title>
    <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../public/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
    <link rel="manifest" href="../public/site.webmanifest">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h1>Java Mailer</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Dashboard</a></li>
                <li><a href="upload.html" class="nav-link">Upload CSV</a></li>
                <li><a href="compose.html" class="nav-link active">Compose Email</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 32px;">Compose Campaign</h1>

        <section>
            <h2>Email Details</h2>

            <!-- Email Compose Form -->
            <form id="email-form" class="email-form">
                <!-- Email Subject -->
                <div class="form-group">
                    <label for="email-subject">Subject *</label>
                    <input 
                        type="text" 
                        id="email-subject" 
                        name="subject" 
                        placeholder="e.g., Welcome to Java Mailer"
                        required
                        maxlength="200"
                    >
                </div>

                <!-- Email Body -->
                <div class="form-group">
                    <label for="email-body">Email Content *</label>
                    <textarea 
                        id="email-body" 
                        name="body" 
                        placeholder="Write your email here... HTML supported"
                        rows="12"
                        required
                    ></textarea>
                    <small style="display: block; margin-top: 6px; color: var(--text-secondary);">Use {{name}}, {{email}}, {{company}} for personalization</small>
                </div>

                <!-- Recipients Selection -->
                <div class="form-group">
                    <label for="recipient-filter">Send To *</label>
                    <div style="display: flex; gap: 0.75rem; margin-bottom: 0.5rem;">
                        <select id="recipient-filter" name="recipient-filter" required style="flex: 1;">
                            <option value="">Select recipients...</option>
                            <option value="all">All Recipients</option>
                            <option value="company-filter">Filter by Company</option>
                            <option value="custom">Custom List</option>
                        </select>
                        <button 
                            type="button" 
                            id="select-recipients-btn" 
                            class="btn btn-secondary"
                            style="white-space: nowrap;"
                        >
                            Select Emails
                        </button>
                    </div>
                </div>

                <!-- Send Settings -->
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="schedule-later" name="schedule-later">
                        Schedule for later
                    </label>
                    <div id="schedule-settings" style="display: none; margin-top: 12px;">
                        <label for="schedule-time">Send at</label>
                        <input type="datetime-local" id="schedule-time" name="schedule-time">
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions" style="margin-top: 24px;">
                    <button type="submit" class="btn btn-primary">Send</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>

                <!-- Status Message -->
                <div id="send-status" class="status-message"></div>
            </form>
        </section>

        <!-- Preview Section -->
        <section>
            <h2>Preview</h2>
            <div id="recipient-count" style="margin-bottom: 16px; padding: 12px; background: var(--bg-tertiary); border-radius: 8px; font-size: 13px;">
                Recipients: <strong id="count-value">0</strong>
            </div>
            <div class="email-preview">
                <div class="preview-content">
                    <p style="margin: 0 0 12px 0; border-bottom: 1px solid var(--border); padding-bottom: 12px;"><strong>Subject:</strong> <span id="preview-subject" style="color: var(--text-secondary);">Your subject will appear here</span></p>
                    <div id="preview-body" class="preview-body" style="color: var(--text-secondary); font-size: 13px;">Your email content will appear here...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Java Mailer. All rights reserved.</p>
    </footer>

    <script src="js/api-config.js"></script>
    <script src="js/email-selector-modal.js"></script>
    <script src="js/compose-handler.js"></script>
</body>
</html>
