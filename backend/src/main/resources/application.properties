# Java Mailer Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=Java Mailer

# Enable DevTools restart
spring.devtools.restart.enabled=false

# ==========================================
# Database Configuration (PostgreSQL via Supabase)
# ==========================================
# PostgreSQL JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase PostgreSQL Connection (Using PgBouncer Pooler for IPv4 compatibility)
# Pooler host: aws-1-ap-northeast-1.pooler.supabase.com:5432
# Direct DB (IPv6 only): db.gksgsxkusmorkbtkjemh.supabase.co:5432
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.gksgsxkusmorkbtkjemh
spring.datasource.password=8Qa8r5tZj5G5EGUf

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
# Skip schema validation that causes scale issues
spring.jpa.generate-ddl=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# Flyway Database Migrations
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# ==========================================
# Security Configuration (JWT & Authentication)
# ==========================================
# JWT Secret Key (CHANGE THIS IN PRODUCTION!)
jwt.secret=your-super-secret-jwt-key-change-this-in-production-min-32-chars
jwt.expiration.ms=3600000

# ==========================================
# Resend Configuration (SendFlow System Emails)
# ==========================================
# Resend API for sending system emails (OTP, verification, notifications)
# NOTE: Using onboarding@resend.dev for development/testing
# For production, verify your domain on https://resend.com/domains
resend.api-key=re_Drfb3Eq2_7a6KFTm1K4cFcDYjuJCaBSPE
resend.from-email=onboarding@resend.dev

# ==========================================
# SMTP Configuration (Email Settings)
# ==========================================
# These values are for user-configured email providers (campaigns)
# Examples: Gmail, Outlook, SendGrid, AWS SES, etc.
# NOTE: Users configure their own SMTP credentials via API
# Default fallback SMTP settings (mostly for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Email Configuration
mail.from.name=SendFlow Campaign System
mail.from.address=campaigns@sendflow.io

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.javamailer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ==========================================
# File Upload Configuration
