# Java Mailer Application Configuration

# Server Configuration
# Render injects PORT at runtime; default remains 8080 for local development.
server.port=${PORT:8080}
server.servlet.context-path=/api

# Application Name
spring.application.name=Java Mailer

# Enable DevTools restart
spring.devtools.restart.enabled=false

# ==========================================
# Database Configuration (PostgreSQL via Supabase)
# ==========================================
# PostgreSQL JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase PostgreSQL Connection (Using PgBouncer Pooler for IPv4 compatibility)
# Pooler host: aws-1-ap-northeast-1.pooler.supabase.com:5432
# Direct DB (IPv6 only): db.gksgsxkusmorkbtkjemh.supabase.co:5432
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
# Skip schema validation that causes scale issues
spring.jpa.generate-ddl=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# Flyway Database Migrations
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# ==========================================
# Security Configuration (JWT & Authentication)
# ==========================================
# Comma-separated allowed origin patterns for CORS (supports Vercel preview URLs).
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app}
# JWT Secret Key (CHANGE THIS IN PRODUCTION!)
jwt.secret=${JWT_SECRET:change-me-min-32-chars}
jwt.expiration.ms=3600000

# ==========================================
# Resend Configuration (SendFlow System Emails)
# ==========================================
# Resend API for sending system emails (OTP, verification, notifications)
# NOTE: Using onboarding@resend.dev for development/testing
# For production, verify your domain on https://resend.com/domains
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# ==========================================
# SMTP Configuration (Email Settings)
# ==========================================
# These values are for user-configured email providers (campaigns)
# Examples: Gmail, Outlook, SendGrid, AWS SES, etc.
# NOTE: Users configure their own SMTP credentials via API
# Default fallback SMTP settings (mostly for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Email Configuration
mail.from.name=SendFlow Campaign System
mail.from.address=campaigns@sendflow.io

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.javamailer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ==========================================
# File Upload Configuration
# ==========================================
# Maximum file upload size (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CSV Upload directory
upload.dir=./uploads

# ==========================================
# Supabase Storage Configuration (REST API)
# ==========================================
# Supabase Storage API endpoint
supabase.storage.url=https://gksgsxkusmorkbtkjemh.supabase.co/storage/v1
# Supabase SERVICE_ROLE key for backend operations (has full access to private buckets)
# Get from: https://app.supabase.com/project/gksgsxkusmorkbtkjemh/settings/api
supabase.api-key=${SUPABASE_API_KEY:}

# ==========================================
# Supabase S3 Storage Configuration (AWS SDK)
# ==========================================
# S3 endpoint for Supabase Storage (S3-compatible API)
supabase.s3.endpoint=https://gksgsxkusmorkbtkjemh.supabase.co/storage/v1/s3
supabase.s3.region=us-east-1
supabase.s3.bucket.csv=csv_uploads
supabase.s3.bucket.avatar=avatar_img
# S3 credentials for Supabase Storage
# Note: These are placeholder values - configure in production
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:}

# ==========================================
# Jackson Configuration (JSON Serialization)
# ==========================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
