# Java Mailer Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=Java Mailer

# Enable DevTools restart
spring.devtools.restart.enabled=true

# ==========================================
# SMTP Configuration (Email Settings)
# ==========================================
# These values are placeholders and must be configured based on your email provider
# Examples: Gmail, Outlook, SendGrid, AWS SES, etc.

# SMTP Server Host
# Example for Gmail: smtp.gmail.com
# Example for Outlook: smtp-mail.outlook.com
spring.mail.host=smtp.gmail.com

# SMTP Port
# Common ports: 25 (unencrypted), 587 (TLS), 465 (SSL)
spring.mail.port=587

# Email sender username
spring.mail.username=your-email@gmail.com

# Email sender password or app-specific password
spring.mail.password=your-app-password

# SMTP Protocol Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Email Configuration
mail.from.name=Java Mailer System
mail.from.address=noreply@javamailer.com

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.javamailer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ==========================================
# File Upload Configuration
# ==========================================
# Maximum file upload size (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CSV Upload directory
upload.dir=./uploads

# ==========================================
# Jackson Configuration (JSON Serialization)
# ==========================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
