services:
  - type: web
    name: sendflow-backend
    env: java
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/java-mailer-backend-1.0.0.jar
    healthCheckPath: /api/emails/health
    envVars:
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000
