services:
  - type: web
    name: sendflow-backend
    env: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/emails/health
    envVars:
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000
